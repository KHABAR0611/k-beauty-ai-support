name: Source and retrieval contract checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source-validation:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install -r requirements/ingestion-test.lock
      - run: python -m kbeauty_support.ingestion.audit --data-dir data
      - run: python -m kbeauty_support.ingestion.cli --data-dir data --output-dir artifacts/ingestion --dry-run
      - run: python -m kbeauty_support.ingestion.cli --data-dir data --output-dir artifacts/ingestion
      - run: python -m pytest
      - name: Validate Compose configuration
        env:
          QDRANT_API_KEY: ci-config-validation-only
        run: docker compose config --quiet
  dense-contracts:
    runs-on: windows-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - run: python -m pip install -r requirements/rerank-test.lock
      - run: python -m pip check
      - run: python -m pytest
      # Real model and Server checks are explicit; this job does not claim either.
